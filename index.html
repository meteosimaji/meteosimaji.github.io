<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to meteosimaji</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap");

    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --fg: #1f2933;
      --accent: #3b82f6;
      --card: #ffffffcc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 32px 16px 96px;
      background: radial-gradient(circle at 20% 20%, #e0eaff, #f8fafc 40%),
        radial-gradient(circle at 80% 0%, #c7d2fe, transparent 35%),
        var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 32px;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
      z-index: 1;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.4rem;
      letter-spacing: -0.02em;
    }

    p {
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #f8fafc;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.4);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 8px;
      padding: 0;
      list-style: none;
    }

    .tag {
      padding: 6px 12px;
      background: #e5edff;
      color: #1e3a8a;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .footer-brand {
      position: fixed;
      inset: auto 0 0;
      padding: 0 10px 10px;
      font-size: clamp(7rem, 30vw, 24rem);
      font-family: "Baloo 2", "Inter", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-weight: 800;
      letter-spacing: clamp(-0.02em, 0.38vw, 0.36em);
      color: rgba(31, 41, 51, 0.08);
      text-align: center;
      line-height: 0.92;
      user-select: none;
      mix-blend-mode: multiply;
      text-decoration: none;
      display: block;
      width: 100%;
      transition: transform 120ms ease, color 120ms ease;
    }

    .footer-brand:hover {
      transform: scale(1.03);
      color: rgba(31, 41, 51, 0.12);
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">meteosimaji.github.io</p>
    <h1>こんにちは、meteosimajiです</h1>
    <p>
      シンプルなホームページへようこそ。このサイトでは、実験的なプロジェクトや学習のアウトプットをまとめていきます。
      ブラウザから見やすくなるよう、軽いデザインで構成しています。
    </p>
    <p>
      下のリンクからコンテンツを増やしていく予定です。リポジトリに変更を加えたら、このトップページを更新してください。
    </p>
    <a class="cta" href="https://github.com/meteosimaji" target="_blank" rel="noreferrer noopener">
      GitHub プロフィールを見る
      <span aria-hidden="true">↗</span>
    </a>
    <ul class="tags" aria-label="現在取り組んでいるテーマ">
      <li class="tag">Web</li>
      <li class="tag">学習</li>
      <li class="tag">実験</li>
      <li class="tag">公開メモ</li>
    </ul>
  </main>
  <a
    class="footer-brand"
    href="https://x.com/meteo_IDT"
    target="_blank"
    rel="noreferrer noopener"
  >
    Meteo
  </a>
</body>
</html>
